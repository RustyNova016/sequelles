[package]
name = "sequelles"
description = "Bunch of utilities to deal with SQLx data. Very opinionated"
version = "0.2.0"
edition = "2024"
rust-version = "1.94.0"
authors = ["RustyNova"]
license = "MIT OR AGPL-3.0-or-later"
keywords = ["sqlx", "database", "data-structure", "development"]
repository = "https://github.com/RustyNova016/sequelles"

[dependencies]
# workspace
sequelles_derive = {path = "./sequelles_derive"}

# SQL
sea-query = { version = "1.0.0", optional = true , features = ["sqlx-utils"]}
sqlx = { version = "0.9.0", features = ["macros"]}
sea-query-sqlx = { version = "0.9.0", optional = true  }

# Async
async-io = "2.6.0"
async-once-cell = { version = "0.5.4", optional = true }

# Other
bon = { version = "3.7.2", optional = true }
deadpool = { version = "0.13.0", optional = true, default-features = false, features = ["managed"] }
snafu = { version = "0.9.0", optional = true, features = ["rust_1_81"] }

[dev-dependencies]
tokio = { version = "1.38.0", features = ["full"] }
env_logger = "0.11.10"
smol = "2.0.2"
smol-macros = "0.1.1"
macro_rules_attribute = "0.2.2"
filium = { git = "https://codeberg.org/RustyNova016/filium.git", rev = "535bbd412d7aacb7b3c4f1732ef4b75fa5a6419b" }


[features]
default = ["sqlite"]
sea_query = ["dep:sea-query", "dep:sea-query-sqlx"]

# Database
sqlite = ["dep:deadpool", "dep:bon", "dep:async-once-cell", "dep:snafu", "sqlx/sqlite", "sea-query/sqlx-utils", "sea-query-sqlx/sqlx-sqlite"]
postgres = ["sqlx/postgres", "sea-query-sqlx/sqlx-postgres"]

# Database types
chrono = ["sqlx/chrono", "sea-query/with-chrono"]
uuid = ["sqlx/uuid", "sea-query/with-uuid"]

# Runtimes
runtime-tokio = ["sqlx/runtime-tokio"]
runtime-smol = ["sqlx/runtime-smol"]

# Macros
error_struct = ["dep:snafu"]
builder = ["dep:bon", "sequelles_derive/builder"]

migrate = ["sqlx/migrate"]



[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[workspace]
members = ["./", "sequelles_derive", "sequelles_sql_gen"]

[[example]]
required-features = ["sqlite", "postgres", "runtime-smol", "error_struct"]
doc-scrape-examples = true
name = "sqlite_orm"
path = "examples/sqlite_orm/main.rs"
